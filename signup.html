<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Signup - FashionBD</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    >

    <link rel="stylesheet" href="css/style.css">

</head>


<body>


<!-- TOP BAR -->

<div class="top-bar">

    <div class="container">

        <div class="d-flex justify-content-between">

            <span id="currentDateTime"></span>

            <div class="top-links">

                <a href="#">My Account</a>
                <a href="#">Wishlist</a>
                <a href="login.html">Login</a>
                <a href="signup.html">Register</a>

            </div>

        </div>

    </div>

</div>


<!-- HEADER -->

<header class="main-header">

    <div class="container">

        <div class="header-content">

            <a href="index.html" class="logo">

                <i class="bi bi-bag-heart-fill"></i>

                Fashion<span>BD</span>

            </a>


            <div class="search-box">

                <input
                    type="text"
                    placeholder="Search products..."
                >

                <button onclick="searchProduct()">

                    <i class="bi bi-search"></i>

                </button>

            </div>


            <a href="#" class="cart-button">

                <i class="bi bi-cart3"></i>

                Cart

                <span class="cart-count">
                    0
                </span>

            </a>

        </div>

    </div>

</header>


<!-- NAVIGATION -->

<nav class="navbar navbar-expand-lg navbar-dark custom-navbar">

    <div class="container">

        <button
            class="navbar-toggler"
            data-bs-toggle="collapse"
            data-bs-target="#mainNavbar"
        >

            <span class="navbar-toggler-icon"></span>

        </button>


        <div
            class="collapse navbar-collapse"
            id="mainNavbar"
        >

            <ul class="navbar-nav mx-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        Home
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="products.html">
                        Products
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="product-detail.html">
                        Product Detail
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="signup.html">
                        Signup
                    </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="login.html">
                        Login
                    </a>
                </li>

            </ul>

        </div>

    </div>

</nav>


<!-- SIGNUP -->

<div class="auth-section">

    <div class="container">

        <div class="auth-card">

            <div class="auth-header">

                <i class="bi bi-person-plus-fill"></i>

                <h2>Create Account</h2>

                <p>
                    Register your new FashionBD account
                </p>

            </div>


            <form
                id="signupForm"
                onsubmit="handleSignup(event)"
            >


                <div class="row">


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            First Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="firstName"
                            placeholder="Enter first name"
                            required
                        >

                    </div>


                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Last Name
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="lastName"
                            placeholder="Enter last name"
                            required
                        >

                    </div>


                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Phone
                    </label>

                    <input
                        type="tel"
                        class="form-control"
                        name="phone"
                        placeholder="01XXXXXXXXX"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        class="form-control"
                        name="email"
                        placeholder="example@email.com"
                        required
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="username"
                        placeholder="Choose username"
                        required
                    >

                </div>


                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        name="password"
                        placeholder="Create password"
                        minlength="6"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100"
                >

                    <i class="bi bi-person-plus"></i>

                    Create Account

                </button>


                <p class="auth-footer">

                    Already have an account?

                    <a href="login.html">
                        Login here
                    </a>

                </p>


            </form>

        </div>

    </div>

</div>


<!-- FOOTER -->

<footer class="footer">

    <div class="container">

        <p class="text-center mb-0">
            © 2026 FashionBD. All Rights Reserved.
        </p>

    </div>

</footer>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="js/script.js"></script>

</body>
</html>
